trigger:
  branches:
    include: [main]

pool:
  name: Default

variables:
  imageName: kalanajy/todo-app

stages:
  - stage: Build
    jobs:
      - job: BuildTest
        steps:
          - script: |
              python3 -m venv venv
              . venv/bin/activate
              pip install -r requirements.txt
              pytest
            displayName: Install and test
          - task: Docker@2
            displayName: Build and push Docker image
            inputs:
              containerRegistry: 'DockerHub'
              repository: '$(imageName)'
              command: 'buildAndPush'
              Dockerfile: Dockerfile
              tags: |
                $(Build.BuildId)
                latest
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.SourcesDirectory)'
              artifactName: app
  - stage: DeployLinux
    dependsOn: Build
    jobs:
    - deployment: Linux
      pool:
        name: Default
      environment: linux-vm
      strategy:
        runOnce:
          deploy:
            steps:
            - download: current
              artifact: app
            - script: bash $(Pipeline.Workspace)/app/deploy/deploy-linux.sh $(Pipeline.Workspace)/app
              displayName: Deploy to Linux